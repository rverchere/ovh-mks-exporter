name: Plumber

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write   # required to publish the Plumber Score badge

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: getplumber/plumber@59d586ada029ab9691105c5a6aa803ef04c00d07 # v0.4.23
        with:
          threshold: 60      # fail under a 60% Plumber Score
          score-push: true   # publishes a public Plumber Score badge
